name: Release

# Tagging is the release: `git tag v1.2.0 && git push --tags` builds the app and
# publishes it. Also runnable by hand to rehearse a build without tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build.sh reads tags and the commit count

      # The Developer ID certificate into a keychain of this run's own, its name
      # for build.sh to sign with. Without the secrets the app is signed ad hoc
      # and nothing is notarized, as before.
      - name: Developer ID
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "no Developer ID secrets: signing ad hoc"; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS=$(openssl rand -hex 16)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$ID" ]; then echo "the certificate has no Developer ID Application identity" >&2; exit 1; fi
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      # Apple checks the signed app and its ticket is stapled to it, so the zip
      # and the DMG made from it below both carry an app that opens without a
      # warning.
      - name: Notarize the app
        if: env.SIGN_IDENTITY != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ./scripts/notarize.sh build/ScreenBox.app

      # Two assets: a DMG for people who just want to drag it to Applications,
      # and a zip for scripted installs. `ditto` rather than `zip` for the
      # latter — it preserves the bundle's symlinks and resource forks.
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::7}"
          ditto -c -k --keepParent build/ScreenBox.app "ScreenBox-$VERSION.zip"
          ./scripts/make-dmg.sh "$VERSION"
          mv "build/ScreenBox-$VERSION.dmg" .
          echo "DMG=ScreenBox-$VERSION.dmg" >> "$GITHUB_ENV"
          echo "ZIP=ScreenBox-$VERSION.zip" >> "$GITHUB_ENV"

      # The DMG itself, signed and notarized too, so opening it never warns.
      - name: Notarize the DMG
        if: env.SIGN_IDENTITY != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          ./scripts/notarize.sh "$DMG"

      - name: Check Gatekeeper accepts them
        if: env.SIGN_IDENTITY != ''
        run: |
          spctl -a -vv -t exec build/ScreenBox.app
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          mkdir -p check && ditto -x -k "$ZIP" check && spctl -a -vv -t exec check/ScreenBox.app

      - name: Remove the signing keychain
        if: always() && env.SIGN_IDENTITY != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ScreenBox
          path: |
            ${{ env.DMG }}
            ${{ env.ZIP }}

      # Signed with Orva Studio's Developer ID and notarized: it opens straight
      # from the download.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running a tag build shouldn't fail the job just because the
          # release already exists — replace the asset instead.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" "$ZIP" \
              --title "$GITHUB_REF_NAME" \
              --notes-file .github/install-notes.md \
              --generate-notes
          fi

      # Homebrew installs come from Orva-Studio/homebrew-tap, which pins the
      # version and the zip's checksum. Point it at the release we just made.
      # TAP_TOKEN is a PAT with contents:write on that repo — github.token is
      # scoped to this one and can't push there.
      - name: Update the Homebrew cask
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)

          git clone --depth 1 \
            "https://x-access-token:$GH_TOKEN@github.com/Orva-Studio/homebrew-tap.git" tap
          CASK=tap/Casks/screenbox.rb

          # Only the two pinned lines change; the rest of the cask is hand-kept.
          sed -i '' \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" \
            "$CASK"

          cd tap
          git diff --quiet && { echo "Cask already at $VERSION"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Update ScreenBox to $VERSION"
          git push -q
